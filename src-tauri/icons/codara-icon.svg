<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4c1d95" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle shine overlay -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#shine)"/>

  <!-- Code bracket: < -->
  <path d="M 210 176 L 130 256 L 210 336" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Code bracket: > -->
  <path d="M 302 176 L 382 256 L 302 336" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center dot / spark -->
  <circle cx="256" cy="256" r="18" fill="#f5d0fe" opacity="0.9"/>

  <!-- Subtle inner border -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.12"/>
</svg>
